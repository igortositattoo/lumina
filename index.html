		<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none}#canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;outline:none}</style>
		<title>Lúmina • Pequeno Mundo</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":393177076,"index.wasm":38047590},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
// LAN test build (pipeline/web_lan.py): what goes wrong here is posted to the server
// (tmp_cmp/web_errors.log), since the page cannot be watched from the PC.
function lanLog(text) {
	try { navigator.sendBeacon('/log', String(text).slice(0, 2000)); } catch (e) {}
}
window.addEventListener('error', (e) => lanLog('erro: ' + e.message + ' em ' + e.filename + ':' + e.lineno));
window.addEventListener('unhandledrejection', (e) => lanLog('promessa: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason)));
// Godot's errors, not its warnings (the planet's animation warnings alone ran past the cap), with the
// "at:" line that follows each kept one.
let lanPrinted = 0;
let lanKeepAt = false;
GODOT_CONFIG['onPrintError'] = function (...parts) {
	console.error(...parts);
	const text = parts.join(' ');
	if (text.trim().startsWith('at:')) {
		if (lanKeepAt && lanPrinted < 60) lanLog('godot:   ' + text.trim());
		return;
	}
	lanKeepAt = !text.includes('WARNING');
	if (lanKeepAt && lanPrinted++ < 60) lanLog('godot: ' + text);
};
(function () {
	const query = new URLSearchParams(window.location.search);
	const big = Math.min(screen.width, screen.height) >= 600;
	const phone = query.get('tela') === 'iphone' || (query.has('layout') && big && query.get('tela') !== 'livre');
	lanLog('pagina aberta ' + window.location.search + ' ' + window.innerWidth + 'x' + window.innerHeight + ' dpr ' + window.devicePixelRatio + (phone ? ' tela iphone' : '') + ' faltando: ' + Engine.getMissingFeatures({ threads: false }).join(', '));
	if (!phone) return;
	const canvas = document.getElementById('canvas');
	const W = 1688, H = 780;
	GODOT_CONFIG['canvasResizePolicy'] = 0;
	canvas.width = W;
	canvas.height = H;
	function fit() {
		const s = Math.min(window.innerWidth / W, window.innerHeight / H);
		canvas.style.width = (W * s) + 'px';
		canvas.style.height = (H * s) + 'px';
		canvas.style.left = ((window.innerWidth - W * s) / 2) + 'px';
		canvas.style.top = ((window.innerHeight - H * s) / 2) + 'px';
	}
	fit();
	window.addEventListener('resize', fit);
	const tag = document.createElement('div');
	tag.textContent = 'Tela de iPhone deitado (844x390)   ?tela=livre para a janela toda';
	tag.style.cssText = 'position:fixed;left:8px;top:6px;color:#8a8a8a;font:12px sans-serif;z-index:2;pointer-events:none';
	document.body.appendChild(tag);
}());
// --- LUMINA parts loader (pipeline/web_publish.py) ---
// GitHub Pages refuses files over 100 MB: the pack is served in parts, and the engine's fetch of
// index.pck gets them streamed one after another.
const PCK_PARTS = ["index.pck.part0", "index.pck.part1", "index.pck.part2", "index.pck.part3", "index.pck.part4"];
const PCK_SIZE = 393177076;
const plainFetch = globalThis.fetch.bind(globalThis);
globalThis.fetch = function (input, init) {
	const url = typeof input === 'string' ? input : ((input && input.url) || '');
	if (!url.endsWith('index.pck')) {
		return plainFetch(input, init);
	}
	const base = url.slice(0, url.lastIndexOf('/') + 1);
	let next = 0;
	let reader = null;
	const body = new ReadableStream({
		async pull(controller) {
			for (;;) {
				if (reader === null) {
					if (next >= PCK_PARTS.length) {
						controller.close();
						return;
					}
					const name = PCK_PARTS[next];
					next += 1;
					const response = await plainFetch(base + name);
					if (!response.ok) {
						throw new Error('Failed loading ' + name);
					}
					reader = response.body.getReader();
				}
				const chunk = await reader.read();
				if (chunk.done) {
					reader = null;
					continue;
				}
				controller.enqueue(chunk.value);
				return;
			}
		},
	});
	return Promise.resolve(new Response(body, { headers: { 'Content-Length': String(PCK_SIZE), 'Content-Type': 'application/octet-stream' } }));
};
// --- end parts loader ---
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		lanLog('falha: ' + ((err && err.message) || err));
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	// LAN test build (pipeline/web_lan.py): served over plain HTTP, which a phone
	// browser calls insecure. Without threads the engine runs there anyway.
	const missingFiltered = missing.filter((m) => !m.startsWith('Secure Context'));
	if (missingFiltered.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			lanLog('jogo iniciado');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
